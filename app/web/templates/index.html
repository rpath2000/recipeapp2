<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recipe Dashboard</title>
<style>
:root {
  --un-background-01: #ffffff;
  --un-background-02: #f5f5f5;
  --un-text-default: #1a1a1a;
  --un-text-muted: #6b6b6b;
  --un-primary-default: #071d49;
  --un-primary-hover: #0a2559;
  --un-primary-pressed: #051733;
  --un-border-color-separator: #d4d4d4;
  --un-border-color-container: #c4c4c4;
  --un-focus-color: #0066cc;
  --un-focus-width: 2px;
  --un-focus-offset: 2px;
  --un-radius-medium: 4px;
  --un-font-family-primary: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  --un-font-weight-primary-regular: 400;
  --un-font-weight-primary-bold: 700;
  --un-typography-title-h1-font-size: 2rem;
  --un-typography-body-font-size: 1rem;
  --un-space-card-body-horizontal: 1.5rem;
  --un-info-default: #0066cc;
  --un-info-background: #e6f2ff;
}

.unity-theme {
  font-family: var(--un-font-family-primary);
  font-size: var(--un-typography-body-font-size);
  font-weight: var(--un-font-weight-primary-regular);
  color: var(--un-text-default);
  background-color: var(--un-background-01);
  line-height: 1.5;
  padding: 2rem;
  min-height: 100vh;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 0;
}

h1 {
  font-size: var(--un-typography-title-h1-font-size);
  font-weight: var(--un-font-weight-primary-bold);
  margin: 0 0 1.5rem 0;
  color: var(--un-text-default);
}

button {
  font-family: var(--un-font-family-primary);
  font-size: var(--un-typography-body-font-size);
  font-weight: var(--un-font-weight-primary-bold);
  color: #ffffff;
  background-color: var(--un-primary-default);
  border: none;
  border-radius: var(--un-radius-medium);
  padding: 0.75rem 1.5rem;
  cursor: pointer;
  transition: background-color 0.2s;
}

button:hover {
  background-color: var(--un-primary-hover);
}

button:active {
  background-color: var(--un-primary-pressed);
}

button:focus {
  outline: var(--un-focus-width) solid var(--un-focus-color);
  outline-offset: var(--un-focus-offset);
}

a {
  color: var(--un-primary-default);
  text-decoration: underline;
  cursor: pointer;
}

a:hover {
  color: var(--un-primary-hover);
}

a:focus {
  outline: var(--un-focus-width) solid var(--un-focus-color);
  outline-offset: var(--un-focus-offset);
  border-radius: 2px;
}

table {
  width: 100%;
  border-collapse: collapse;
  background-color: var(--un-background-01);
  border: 1px solid var(--un-border-color-container);
  border-radius: var(--un-radius-medium);
}

thead {
  background-color: var(--un-background-02);
  border-bottom: 2px solid var(--un-border-color-separator);
}

th {
  text-align: left;
  padding: 1rem;
  font-weight: var(--un-font-weight-primary-bold);
  color: var(--un-text-default);
}

td {
  padding: 1rem;
  border-top: 1px solid var(--un-border-color-separator);
  color: var(--un-text-default);
}

tbody tr:hover {
  background-color: var(--un-background-02);
}

.dashboard-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 2rem;
}

.alert-info {
  background-color: var(--un-info-background);
  color: var(--un-text-default);
  border-left: 4px solid var(--un-info-default);
  padding: 1rem var(--un-space-card-body-horizontal);
  margin-bottom: 1.5rem;
  border-radius: var(--un-radius-medium);
}

.empty-state {
  text-align: center;
  padding: 3rem 1rem;
  color: var(--un-text-muted);
}
</style>
  {% include "_shared_styles.html" %}
</head>
<body>
<div class="unity-theme" data-mode="light" data-density="balanced">
  <header class="dashboard-header">
    <h1>Recipe Dashboard</h1>
    <a href="/recipe/new"><button>New Recipe</button></a>
  </header>

  <main>
    <!-- FRS-017: Error message display when recipe not found -->
    <!-- Example: Recipe not found: 999999 -->
    <!-- Uncomment below to show error state:
    <div class="alert-info" role="alert">
      Recipe not found: 999999
    </div>
    -->

    <!-- FRS-008: HTML table with thead, tbody, th elements for accessibility -->
    <!-- FRS-009: Recipes ordered by updated_at DESC, id DESC -->
    <table>
      <thead>
        <tr>
          <th scope="col">ID</th>
          <th scope="col">Name</th>
          <th scope="col">Ingredients</th>
        </tr>
      </thead>
      <tbody>{% for item in recipes %}<tr>
          <td><a href="/recipe/105">{{ item.id }}</a></td>
          <td>{{ item.name }}</td>
          <td>{{ item.ingredients }}</td>
        </tr>{% endfor %}</tbody>
    </table>
  </main>
</div>
</body>
</html>
