<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recipe Dashboard</title>
<style>
/* AbbVie Unity embedded base styles are assumed loaded */

/* Responsive table container for narrow viewports (FRS-011, US-011) */
.recipe-table-container {
  width: 100%;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}

.recipe-table {
  width: 100%;
  border-collapse: collapse;
  background: var(--un-background-01);
  border: 1px solid var(--un-border-color-container);
}

.recipe-table thead {
  background: var(--un-background-02);
  border-bottom: 2px solid var(--un-border-color-separator);
}

.recipe-table th,
.recipe-table td {
  padding: var(--un-space-card-body-horizontal);
  text-align: left;
  border-bottom: 1px solid var(--un-border-color-container);
  color: var(--un-text-default);
  font-family: var(--un-font-family-primary);
  font-size: var(--un-typography-body-font-size);
  line-height: var(--un-typography-body-line-height);
}

.recipe-table th {
  font-weight: var(--un-font-weight-primary-bold);
  color: var(--un-text-default);
}

.recipe-table tbody tr:hover {
  background: var(--un-background-02);
}

.recipe-table tbody tr:last-child td {
  border-bottom: none;
}

/* ID column link styling */
.recipe-id-link {
  color: var(--un-primary-default);
  text-decoration: underline;
  font-family: var(--un-font-family-mono);
  cursor: pointer;
}

.recipe-id-link:hover {
  color: var(--un-primary-hover);
}

.recipe-id-link:active {
  color: var(--un-primary-pressed);
}

.recipe-id-link:focus {
  outline: var(--un-focus-width) solid var(--un-focus-color);
  outline-offset: var(--un-focus-offset);
  border-radius: var(--un-radius-small);
}

/* Page header and nav */
.page-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: calc(var(--un-grid-space-gutter-default) * 2);
  flex-wrap: wrap;
  gap: var(--un-grid-space-gutter-default);
}

.page-title {
  margin: 0;
  color: var(--un-text-default);
  font-family: var(--un-font-family-primary);
  font-size: var(--un-typography-title-h1-font-size);
  font-weight: var(--un-font-weight-primary-bold);
  line-height: var(--un-typography-title-h1-line-height);
}

/* Responsive adjustments for narrow viewports (FRS-011, US-011) */
@media (max-width: 600px) {
  .recipe-table th,
  .recipe-table td {
    padding: calc(var(--un-space-card-body-horizontal) / 2);
    font-size: calc(var(--un-typography-body-font-size) * 0.9);
  }
  
  .page-header {
    flex-direction: column;
    align-items: flex-start;
  }
  
  .page-title {
    font-size: calc(var(--un-typography-title-h1-font-size) * 0.85);
  }
}

/* Empty state message */
.empty-state {
  padding: calc(var(--un-grid-space-gutter-default) * 3);
  text-align: center;
  color: var(--un-text-muted);
  font-family: var(--un-font-family-primary);
  font-size: var(--un-typography-body-font-size);
}
</style>
  {% include "_shared_styles.html" %}
</head>
<body>
<div class="unity-theme" data-mode="light" data-density="balanced">
  <header class="page-header">
    <h1 class="page-title">Recipe Dashboard</h1>
    <nav>
      <a href="/recipe">
        <button>Create New Recipe</button>
      </a>
    </nav>
  </header>
  
  <main>
    <div class="recipe-table-container">
      <table class="recipe-table">
        <thead>
          <tr>
            <th scope="col">ID</th>
            <th scope="col">Name</th>
            <th scope="col">Ingredients</th>
          </tr>
        </thead>
        <tbody>{% for item in recipes %}<tr>
            <td><a href="/recipe?id={{ item.id }}" class="recipe-id-link">{{ item.id }}</a></td>
            <td>{{ item.name }}</td>
            <td>{{ item.ingredients }}</td>
          </tr>{% endfor %}</tbody>
      </table>
    </div>
  </main>
</div>
</body>
</html>
