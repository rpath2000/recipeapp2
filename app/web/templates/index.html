<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recipe Dashboard</title>
  <style>
    /* Unity base layer embedded by agent — tokens available */
    :root {
      --un-background-01: #ffffff;
      --un-background-02: #f8f9fa;
      --un-background-inverse: #1a1a1a;
      --un-text-default: #1a1a1a;
      --un-text-muted: #6c757d;
      --un-text-inverse: #ffffff;
      --un-primary-default: #0066cc;
      --un-primary-hover: #0052a3;
      --un-primary-pressed: #003d7a;
      --un-brand-500: #0066cc;
      --un-border-color-container: #dee2e6;
      --un-border-color-separator: #e9ecef;
      --un-focus-color: #0066cc;
      --un-focus-width: 2px;
      --un-focus-offset: 2px;
      --un-font-family-primary: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --un-font-weight-primary-regular: 400;
      --un-font-weight-primary-bold: 700;
      --un-typography-title-h1-font-size: 2rem;
      --un-typography-body-font-size: 1rem;
      --un-typography-body-line-height: 1.5;
      --un-radius-small: 4px;
      --un-radius-medium: 8px;
      --un-space-card-body-horizontal: 1.5rem;
      --un-grid-space-gutter-default: 1rem;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: var(--un-font-family-primary);
      font-size: var(--un-typography-body-font-size);
      line-height: var(--un-typography-body-line-height);
      color: var(--un-text-default);
      background-color: var(--un-background-01);
    }

    .unity-theme {
      min-height: 100vh;
      padding: 2rem var(--un-space-card-body-horizontal);
    }

    header {
      margin-bottom: 2rem;
    }

    h1 {
      margin: 0 0 0.5rem 0;
      font-size: var(--un-typography-title-h1-font-size);
      font-weight: var(--un-font-weight-primary-bold);
      color: var(--un-text-default);
    }

    .header-actions {
      margin-top: 1rem;
    }

    a {
      color: var(--un-primary-default);
      text-decoration: none;
      font-weight: var(--un-font-weight-primary-regular);
    }

    a:hover {
      color: var(--un-primary-hover);
      text-decoration: underline;
    }

    a:focus {
      outline: var(--un-focus-width) solid var(--un-focus-color);
      outline-offset: var(--un-focus-offset);
      border-radius: var(--un-radius-small);
    }

    main {
      max-width: 1200px;
    }

    .un-card {
      background-color: var(--un-background-01);
      border: 1px solid var(--un-border-color-container);
      border-radius: var(--un-radius-medium);
      padding: var(--un-space-card-body-horizontal);
      margin-bottom: var(--un-grid-space-gutter-default);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      border: 1px solid var(--un-border-color-container);
      background-color: var(--un-background-01);
    }

    thead {
      background-color: var(--un-background-02);
    }

    th, td {
      padding: 0.75rem var(--un-space-card-body-horizontal);
      text-align: left;
      border-bottom: 1px solid var(--un-border-color-separator);
    }

    th {
      font-weight: var(--un-font-weight-primary-bold);
      color: var(--un-text-default);
    }

    td {
      color: var(--un-text-default);
    }

    tbody tr:hover {
      background-color: var(--un-background-02);
    }

    tbody tr:last-child td {
      border-bottom: none;
    }

    .recipe-id-link {
      font-weight: var(--un-font-weight-primary-bold);
    }

    .empty-state {
      padding: 2rem;
      text-align: center;
      color: var(--un-text-muted);
    }
  </style>
  {% include "_shared_styles.html" %}
</head>
<body>
  <div class="unity-theme" data-mode="light" data-density="balanced">
    <header>
      <h1>Recipe Dashboard</h1>
      <div class="header-actions">
        <a href="/recipe">Add a recipe</a>
      </div>
    </header>

    <main>
      <section class="un-card">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Recipe Name</th>
              <th>Ingredients</th>
            </tr>
          </thead>
          <tbody>{% for item in recipes %}<tr>
              <td><a href="/recipe?id={{ item.id }}" class="recipe-id-link">{{ item.id }}</a></td>
              <td>{{ item.name }}</td>
              <td>{{ item.ingredients }}</td>
            </tr>{% endfor %}</tbody>
        </table>
      </section>
    </main>
  </div>
</body>
</html>
