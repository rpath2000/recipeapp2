<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recipe Form</title>
  <style>
    :root {
      --un-background-01: #ffffff;
      --un-background-02: #f8f9fa;
      --un-background-inverse: #1a1d21;
      --un-text-default: #1a1d21;
      --un-text-muted: #5f6368;
      --un-text-inverse: #ffffff;
      --un-primary-default: #0066cc;
      --un-primary-hover: #0052a3;
      --un-primary-pressed: #003d7a;
      --un-brand-500: #0066cc;
      --un-brand-600: #0052a3;
      --un-brand-700: #003d7a;
      --un-error-default: #d32f2f;
      --un-success-default: #2e7d32;
      --un-warning-default: #f57c00;
      --un-info-default: #0288d1;
      --un-border-color-container: #dadce0;
      --un-border-color-input: #5f6368;
      --un-border-color-separator: #e8eaed;
      --un-focus-color: #0066cc;
      --un-focus-width: 2px;
      --un-focus-offset: 2px;
      --un-font-family-primary: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --un-font-family-mono: "SF Mono", Monaco, Consolas, "Courier New", monospace;
      --un-font-weight-primary-regular: 400;
      --un-font-weight-primary-bold: 600;
      --un-font-weight-primary-light: 300;
      --un-typography-title-h1-font-size: 2rem;
      --un-typography-title-h2-font-size: 1.5rem;
      --un-typography-title-h3-font-size: 1.25rem;
      --un-typography-body-font-size: 1rem;
      --un-typography-caption-font-size: 0.875rem;
      --un-radius-none: 0;
      --un-radius-small: 4px;
      --un-radius-medium: 8px;
      --un-radius-large: 12px;
      --un-radius-xlarge: 16px;
      --un-radius-full: 9999px;
      --un-grid-space-gutter-default: 24px;
      --un-space-card-body-horizontal: 24px;
      --un-space-textinput-horizontal: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--un-font-family-primary);
      font-size: var(--un-typography-body-font-size);
      font-weight: var(--un-font-weight-primary-regular);
      line-height: 1.5;
      color: var(--un-text-default);
      background: var(--un-background-01);
    }

    .unity-theme {
      min-height: 100vh;
      padding: var(--un-grid-space-gutter-default);
    }

    header {
      margin-bottom: calc(var(--un-grid-space-gutter-default) * 1.5);
    }

    h1 {
      font-size: var(--un-typography-title-h1-font-size);
      font-weight: var(--un-font-weight-primary-bold);
      color: var(--un-text-default);
      margin-bottom: 8px;
    }

    nav {
      margin-top: 12px;
    }

    nav a {
      color: var(--un-primary-default);
      text-decoration: none;
      font-size: var(--un-typography-body-font-size);
    }

    nav a:hover {
      color: var(--un-primary-hover);
      text-decoration: underline;
    }

    nav a:focus {
      outline: var(--un-focus-width) solid var(--un-focus-color);
      outline-offset: var(--un-focus-offset);
      border-radius: var(--un-radius-small);
    }

    main {
      max-width: 800px;
    }

    .un-card {
      background: var(--un-background-01);
      border: 1px solid var(--un-border-color-container);
      border-radius: var(--un-radius-medium);
      padding: var(--un-space-card-body-horizontal);
      margin-bottom: var(--un-grid-space-gutter-default);
    }

    .success-message {
      background: var(--un-success-default);
      color: var(--un-text-inverse);
      padding: 12px var(--un-space-card-body-horizontal);
      border-radius: var(--un-radius-small);
      margin-bottom: var(--un-grid-space-gutter-default);
      font-weight: var(--un-font-weight-primary-bold);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .success-message::before {
      content: "✓";
      font-size: 1.25rem;
    }

    .form-group {
      margin-bottom: var(--un-grid-space-gutter-default);
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: var(--un-font-weight-primary-bold);
      color: var(--un-text-default);
    }

    input[type="text"],
    textarea {
      width: 100%;
      padding: var(--un-space-textinput-horizontal);
      font-family: var(--un-font-family-primary);
      font-size: var(--un-typography-body-font-size);
      color: var(--un-text-default);
      background: var(--un-background-01);
      border: 1px solid var(--un-border-color-input);
      border-radius: var(--un-radius-small);
      transition: border-color 0.2s;
    }

    input[type="text"]:focus,
    textarea:focus {
      outline: var(--un-focus-width) solid var(--un-focus-color);
      outline-offset: 0;
      border-color: var(--un-primary-default);
    }

    input[type="text"].error,
    textarea.error {
      border-color: var(--un-error-default);
    }

    textarea {
      min-height: 200px;
      resize: vertical;
      font-family: var(--un-font-family-primary);
    }

    .error-message {
      display: block;
      color: var(--un-error-default);
      font-size: var(--un-typography-caption-font-size);
      margin-top: 6px;
      font-weight: var(--un-font-weight-primary-bold);
    }

    .error-message::before {
      content: "⚠ ";
    }

    .button-group {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    button {
      padding: 10px 24px;
      font-family: var(--un-font-family-primary);
      font-size: var(--un-typography-body-font-size);
      font-weight: var(--un-font-weight-primary-bold);
      color: var(--un-text-inverse);
      background: var(--un-primary-default);
      border: none;
      border-radius: var(--un-radius-small);
      cursor: pointer;
      transition: background-color 0.2s;
    }

    button:hover {
      background: var(--un-primary-hover);
    }

    button:active {
      background: var(--un-primary-pressed);
    }

    button:focus {
      outline: var(--un-focus-width) solid var(--un-focus-color);
      outline-offset: var(--un-focus-offset);
    }

    .un-btn--secondary {
      background: var(--un-background-01);
      color: var(--un-primary-default);
      border: 1px solid var(--un-primary-default);
    }

    .un-btn--secondary:hover {
      background: var(--un-background-02);
      color: var(--un-primary-hover);
      border-color: var(--un-primary-hover);
    }

    .un-btn--secondary:active {
      background: var(--un-background-02);
      color: var(--un-primary-pressed);
      border-color: var(--un-primary-pressed);
    }

    .un-btn--secondary:focus {
      outline: var(--un-focus-width) solid var(--un-focus-color);
      outline-offset: var(--un-focus-offset);
    }

    .char-count {
      font-size: var(--un-typography-caption-font-size);
      color: var(--un-text-muted);
      margin-top: 4px;
      text-align: right;
    }
  </style>
  {% include "_shared_styles.html" %}
</head>
<body>
  <div class="unity-theme" data-mode="light" data-density="balanced">
    <header>
      <h1>Recipe Form</h1>
      <nav>
        <a href="/">← Back to Dashboard</a>
      </nav>
    </header>

    <main>
      <!-- Success message (shown after save) -->
      <!-- <div class="success-message" role="status" aria-live="polite">
        Recipe saved successfully.
      </div> -->

      <form class="un-card" method="post" action="/recipe/save">
        <div class="form-group">
          <label for="recipe-name">Recipe Name</label>
          <input
            type="text"
            id="recipe-name"
            name="name"
            maxlength="120"
            aria-describedby="name-error name-help"
            aria-required="true" value="{{ name }}" />
          <!-- Error message (shown on validation failure) -->
          <!-- <span id="name-error" class="error-message" role="alert">
            Recipe name is required and must not exceed 120 characters.
          </span> -->
          <span id="name-help" class="char-count">Max 120 characters</span>
        </div>

        <div class="form-group">
          <label for="recipe-ingredients">Ingredients</label>
          <textarea
            id="recipe-ingredients"
            name="ingredients"
            maxlength="4000"
            aria-describedby="ingredients-error ingredients-help"
            aria-required="true"
          >{{ ingredients }}</textarea>
          <!-- Error message (shown on validation failure) -->
          <!-- <span id="ingredients-error" class="error-message" role="alert">
            Ingredients are required and must not exceed 4000 characters.
          </span> -->
          <span id="ingredients-help" class="char-count">Max 4000 characters</span>
        </div>

        <div class="button-group">
          <button type="submit">Save</button>
          <button type="button" class="un-btn--secondary">New Recipe</button>
        </div>
      </form>
    </main>
  </div>
</body>
</html>
