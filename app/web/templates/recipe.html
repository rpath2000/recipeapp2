<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recipe Form</title>
  <style>
    :root {
      --un-background-01: #ffffff;
      --un-background-02: #f5f5f5;
      --un-background-inverse: #1a1a1a;
      --un-text-default: #1a1a1a;
      --un-text-muted: #666666;
      --un-text-inverse: #ffffff;
      --un-primary-default: #071d49;
      --un-primary-hover: #0a2659;
      --un-primary-pressed: #05162f;
      --un-brand-500: #071d49;
      --un-brand-600: #05162f;
      --un-brand-700: #030e1f;
      --un-brand-800: #020a14;
      --un-brand-900: #01050a;
      --un-error-default: #d32f2f;
      --un-success-default: #2e7d32;
      --un-warning-default: #ed6c02;
      --un-info-default: #0288d1;
      --un-border-color-container: #e0e0e0;
      --un-border-color-input: #bdbdbd;
      --un-border-color-separator: #e0e0e0;
      --un-focus-color: #071d49;
      --un-focus-width: 2px;
      --un-focus-offset: 2px;
      --un-font-family-primary: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --un-font-family-mono: "Courier New", Courier, monospace;
      --un-font-weight-primary-regular: 400;
      --un-font-weight-primary-bold: 700;
      --un-font-weight-primary-light: 300;
      --un-typography-title-h1-font-size: 2rem;
      --un-typography-title-h2-font-size: 1.5rem;
      --un-typography-title-h3-font-size: 1.25rem;
      --un-typography-body-font-size: 1rem;
      --un-typography-body-line-height: 1.5;
      --un-typography-caption-font-size: 0.875rem;
      --un-radius-none: 0;
      --un-radius-small: 4px;
      --un-radius-medium: 8px;
      --un-radius-large: 12px;
      --un-radius-xlarge: 16px;
      --un-radius-full: 9999px;
      --un-grid-space-gutter-default: 24px;
      --un-space-card-body-horizontal: 24px;
      --un-space-textinput-horizontal: 12px;
    }

    .unity-theme[data-mode="dark"] {
      --un-background-01: #1a1a1a;
      --un-background-02: #2a2a2a;
      --un-background-inverse: #ffffff;
      --un-text-default: #ffffff;
      --un-text-muted: #b3b3b3;
      --un-text-inverse: #1a1a1a;
      --un-border-color-container: #404040;
      --un-border-color-input: #525252;
      --un-border-color-separator: #404040;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--un-font-family-primary);
      font-size: var(--un-typography-body-font-size);
      line-height: var(--un-typography-body-line-height);
      color: var(--un-text-default);
      background-color: var(--un-background-01);
    }

    .unity-theme {
      min-height: 100vh;
      padding: var(--un-grid-space-gutter-default);
    }

    h1 {
      font-size: var(--un-typography-title-h1-font-size);
      font-weight: var(--un-font-weight-primary-bold);
      color: var(--un-text-default);
      margin-bottom: 8px;
    }

    .un-card {
      background-color: var(--un-background-01);
      border: 1px solid var(--un-border-color-container);
      border-radius: var(--un-radius-medium);
      padding: var(--un-space-card-body-horizontal);
      margin-bottom: var(--un-grid-space-gutter-default);
    }

    label {
      display: block;
      font-weight: var(--un-font-weight-primary-bold);
      margin-bottom: 8px;
      color: var(--un-text-default);
    }

    input[type="text"],
    textarea {
      width: 100%;
      padding: var(--un-space-textinput-horizontal);
      font-family: var(--un-font-family-primary);
      font-size: var(--un-typography-body-font-size);
      color: var(--un-text-default);
      background-color: var(--un-background-01);
      border: 1px solid var(--un-border-color-input);
      border-radius: var(--un-radius-small);
      transition: border-color 0.2s;
    }

    input[type="text"]:focus,
    textarea:focus {
      outline: none;
      border-color: var(--un-focus-color);
      box-shadow: 0 0 0 var(--un-focus-width) var(--un-focus-color);
    }

    textarea {
      resize: vertical;
      min-height: 200px;
      font-family: var(--un-font-family-primary);
      line-height: var(--un-typography-body-line-height);
    }

    button {
      padding: 12px 24px;
      font-family: var(--un-font-family-primary);
      font-size: var(--un-typography-body-font-size);
      font-weight: var(--un-font-weight-primary-bold);
      color: var(--un-text-inverse);
      background-color: var(--un-primary-default);
      border: none;
      border-radius: var(--un-radius-small);
      cursor: pointer;
      transition: background-color 0.2s;
    }

    button:hover {
      background-color: var(--un-primary-hover);
    }

    button:active {
      background-color: var(--un-primary-pressed);
    }

    button:focus {
      outline: none;
      box-shadow: 0 0 0 var(--un-focus-width) var(--un-focus-color);
    }

    button.un-btn--secondary {
      color: var(--un-primary-default);
      background-color: transparent;
      border: 1px solid var(--un-primary-default);
    }

    button.un-btn--secondary:hover {
      background-color: var(--un-background-02);
    }

    a {
      color: var(--un-primary-default);
      text-decoration: underline;
      cursor: pointer;
    }

    a:hover {
      color: var(--un-primary-hover);
    }

    a:focus {
      outline: var(--un-focus-width) solid var(--un-focus-color);
      outline-offset: var(--un-focus-offset);
    }

    .form-group {
      margin-bottom: var(--un-grid-space-gutter-default);
    }

    .form-actions {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-top: var(--un-grid-space-gutter-default);
    }

    .alert {
      padding: 16px;
      border-radius: var(--un-radius-small);
      margin-bottom: var(--un-grid-space-gutter-default);
      font-weight: var(--un-font-weight-primary-bold);
    }

    .alert--success {
      background-color: #e8f5e9;
      color: var(--un-success-default);
      border: 1px solid var(--un-success-default);
    }

    .alert--error {
      background-color: #ffebee;
      color: var(--un-error-default);
      border: 1px solid var(--un-error-default);
    }

    .alert ul {
      margin-top: 8px;
      margin-left: 20px;
    }

    .alert li {
      margin-bottom: 4px;
    }

    .char-count {
      font-size: var(--un-typography-caption-font-size);
      color: var(--un-text-muted);
      margin-top: 4px;
      text-align: right;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }
  </style>
  {% include "_shared_styles.html" %}
</head>
<body>
  <div class="unity-theme" data-mode="light" data-density="balanced">
    <div class="container">
      <header>
        <h1>Recipe Form</h1>
        <p style="color: var(--un-text-muted); margin-bottom: var(--un-grid-space-gutter-default);">Create a new recipe or edit an existing one</p>
      </header>

      <main>
        <!-- Success message - shown after successful create/update -->
        <!-- <div class="alert alert--success" role="alert">
          Recipe created successfully
        </div> -->

        <!-- Error messages - shown when validation fails (FRS-005) -->
        <!-- <div class="alert alert--error" role="alert">
          <strong>Please correct the following errors:</strong>
          <ul>
            <li>Recipe name is required</li>
            <li>Ingredients are required</li>
          </ul>
        </div> -->

        <section class="un-card">
          <form method="post" action="/recipe">
            <!-- Hidden field for recipe ID when editing existing recipe (FRS-007, FRS-015) -->
            <!-- <input type="hidden" name="recipe_id" value="123"> -->

            <div class="form-group">
              <label for="recipe-name">Recipe Name <span style="color: var(--un-error-default);">*</span></label>
              <input 
                type="text" 
                id="recipe-name" 
                name="recipe_name" 
                maxlength="120"
                required
                aria-required="true"
                aria-describedby="name-help"
                value=""
              >
              <div id="name-help" class="char-count">Maximum 120 characters</div>
            </div>

            <div class="form-group">
              <label for="recipe-ingredients">Ingredients <span style="color: var(--un-error-default);">*</span></label>
              <textarea 
                id="recipe-ingredients" 
                name="ingredients" 
                maxlength="4000"
                required
                aria-required="true"
                aria-describedby="ingredients-help"
              >{{ ingredients }}</textarea>
              <div id="ingredients-help" class="char-count">Maximum 4000 characters • Line breaks and formatting preserved</div>
            </div>

            <div class="form-actions">
              <button type="submit">Save Recipe</button>
              <a href="/">View all recipes</a>
            </div>
          </form>
        </section>
      </main>
    </div>
  </div>
</body>
</html>
